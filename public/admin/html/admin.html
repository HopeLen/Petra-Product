<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="../css/root.css" />
    <link rel="stylesheet" href="../css/sidebar.css" />
    <link rel="stylesheet" href="../css/content.css" />
    <link rel="stylesheet" href="../css/ZClosing.css" />

    <!-- ==== BOX ICONS CSS ====-->
    <link
      href="https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div>
      <nav class="sidebar">
        <header>
          <div class="image-text">
            <span class="image">
              <img src="../../assets/images/logo.jpg" alt="" id="logo" />
            </span>

            <div class="text header-text">
              <span class="name"></span>
            </div>
          </div>

          <i class="bx bx-chevron-right toggle"></i>
        </header>
        <div class="menu-bar">
          <div class="menu">
            <ul class="menu-links" id="menu-links">
              <li class="nav-link" id="Z סגירת">
                <label>
                  <input type="radio" name="nav" hidden />
                  <i class="bx bx-currency-notes icon"></i>
                  <span class="text nav-text"></span>
                </label>
              </li>

              <li class="nav-link" id="שולחנות">
                <label>
                  <input type="radio" name="nav" hidden />
                  <i class="bx bx-outdoor-dining icon"></i>
                  <span class="text nav-text"></span>
                </label>
              </li>

              <li class="nav-link" id="תפריט">
                <label>
                  <input type="radio" name="nav" hidden />
                  <i class="bx bx-food-menu icon"></i>
                  <span class="text nav-text"></span>
                </label>
              </li>

              <li class="nav-link" id="מלצרים">
                <label>
                  <input type="radio" name="nav" hidden />
                  <i class="bx bx-user-circle icon"></i>
                  <span class="text nav-text"></span>
                </label>
              </li>

              <li class="nav-link" id="מדפסות">
                <label>
                  <input type="radio" name="nav" hidden />
                  <i class="bx bx-printer icon"></i>
                  <span class="text nav-text"></span>
                </label>
              </li>

              <li class="nav-link" id="מידע">
                <label>
                  <input type="radio" name="nav" hidden />
                  <i class="bx bx-file-detail icon"></i>
                  <span class="text nav-text"></span>
                </label>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </div>

    <div class="content" id="content"></div>

    <script type="module" src="../js/scripts.js"></script>
  </body>
</html>
