<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>
    <link rel="stylesheet" href="../index.css" />
    <link rel="stylesheet" href="css/radio-input.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/popup.css" />
    <link rel="stylesheet" href="css/table.css" />
  </head>
  <body>
    <div class="parent">
      <div class="main-box">
        <h1 class="title">:הזמנה קיימת</h1>
        <ul class="order" id="current-order"></ul>
        <h3 id="total-price" style="text-decoration: underline"></h3>
        <h4 id="tip-value"></h4>
        <div class="settings">
          <button
            class="order-send table-move"
            id="table-move"
            onclick="tableMove()"
          >
            הקפצת שולחן
          </button>
          <button class="order-send" id="print-bill">הדפס חשבון</button>
          <button class="order-send order-close" id="order-close">
            סגור חשבון
          </button>
        </div>
      </div>
      <div class="main-box">
        <h1 class="title">:הזמנה</h1>
        <div id="information" class="information">
          <h5 id="tableID"></h5>
          <h5 id="waiterID"></h5>
        </div>
        <ul class="order" id="chosen-items"></ul>
        <button class="order-send" id="order-send">שליחת הזמנה</button>
      </div>
      <div class="main-box">
        <h1 class="title">:תפריט</h1>

        <!-- Radio Bar/Kitchen start -->
        <div class="radio-input">
          <input value="value-1" name="value-radio" id="value-1" type="radio" />
          <input value="value-2" name="value-radio" id="value-2" type="radio" />

          <label for="value-1"><span>בר</span></label>
          <label for="value-2"><span>מטבח</span></label>

          <span class="selection"></span>
        </div>
        <!-- Radio Bar/Kitchen end -->

        <div class="panel" id="menu-sections"></div>
        <div class="menu-container" id="main-menu"></div>
      </div>
    </div>

    <div class="popup" id="popup">
      <div id="overlay" class="overlay"></div>
      <div class="popup-content" id="popup-content">
        <h2 id="item-title"></h2>
        <div class="options" id="options"></div>
        <div class="inputs" id="inputs">
          <input
            inputmode="numeric"
            type="number"
            id="amount"
            class="amount"
            min="1"
            value="1"
          />
          <input type="text" id="comment" class="comment" />
        </div>
        <div class="controls" id="controls">
          <button id="send" class="button" onclick="addComplexItem()"></button>
        </div>
      </div>
    </div>
    <script src="js/close-order.js"></script>
    <script src="js/table-moving.js"></script>
    <script src="js/bill.js"></script>
    <script src="js/complexItemHelpers.js"></script>
    <script src="js/popup.js"></script>
    <script src="js/table.js"></script>
  </body>
</html>
